- title: Summary
  type: list
  contents:
    - HCI researcher working at the intersection of human-AI interaction, computational creativity and collaborative design. My research examines how AI systems shape creative ideation, decision-making and collective creativity. I combine qualitative and quantitative methods with experience in machine learning, data engineering and applied system development across healthcare, governance and education.

